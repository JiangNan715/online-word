<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="词卡 —— 简洁优雅的在线背单词工具，内置四六级 / 雅思 / 托福词书与 AI 学习功能。">
  <title>词卡 · 在线背单词</title>

  <!-- 字体：JetBrains Mono（等宽） · 中文回退到系统无衬线字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 全屏流体背景 -->
  <div class="cyber-bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>

  <!-- 侧边垂直导航栏 -->
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-logo" href="#/home">
      <span class="logo-icon">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </span>
      <span class="logo-text">词卡</span>
    </a>

    <nav class="sidebar-nav" id="mainNav">
      <a href="#/home" data-page="home">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span>首页</span>
      </a>
      <a href="#/books" data-page="books">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span>单词本</span>
      </a>
      <a href="#/learn" data-page="learn">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
        <span>学习</span>
      </a>
      <a href="#/review" data-page="review">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
        <span>复习</span>
      </a>
      <a href="#/stats" data-page="stats">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
        <span>统计</span>
      </a>
      <a href="#/ai-history" data-page="ai-history">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
        <span>AI 中心</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="sidebar-footer-label">当前词书</span>
      <select id="bookSelect" title="切换当前单词本"></select>
    </div>
  </aside>

  <!-- 页面主体 -->
  <main id="app" class="app"></main>

  <!-- 脚本（顺序不变，新增 icons.js 提供统一 SVG 图标） -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/enhance.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ai-game.js"></script>
  <script src="js/ai-history.js"></script>
  <script src="js/sidebar.js"></script>
</body>
</html>
